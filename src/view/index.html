<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>{{name}} — graphe</title>
<style>
{{style}}
</style>
</head>
<body>
<header id="header"></header>
<main>
<aside id="side">
<section>
<input id="search" type="search" placeholder="Rechercher un nœud" autocomplete="off">
<ul id="results"></ul>
</section>
<section>
<button id="reset" type="button">Vue initiale</button>
<button id="expand-all" type="button" title="Affiche tout le graphe, au plus 5000 nœuds (ceux de plus haut degré)">Tout étendre</button>
<button id="expand" type="button" disabled>Étendre</button>
<div id="message" aria-live="polite"></div>
</section>
<section id="coloring">
<h2 id="color-title">Couleur</h2>
<div role="radiogroup" aria-labelledby="color-title">
<label class="filter"><input type="radio" name="color" id="color-kind" value="kind" checked>genre</label>
<label class="filter"><input type="radio" name="color" id="color-community" value="community" aria-describedby="color-note">communauté</label>
</div>
<div id="color-note"></div>
<ul id="legend" aria-label="Légende des communautés" hidden></ul>
</section>
<section>
<h2>Genres de nœuds</h2>
<div id="node-filters"></div>
<h2>Genres de liens</h2>
<div id="edge-filters"></div>
</section>
<section id="details"></section>
</aside>
<canvas id="canvas"></canvas>
</main>
<script type="application/json" id="nephila-data">{{data}}</script>
<script>
{{model}}
</script>
<script>
{{app}}
</script>
</body>
</html>
