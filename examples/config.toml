# Exemple de configuration LLM de nephila (copié sous le nom config.example.toml dans l'archive
# de release).
#
# Emplacement, le premier trouvé dans cet ordre :
#   1. le chemin donné par la variable NEPHILA_CONFIG ;
#   2. $XDG_CONFIG_HOME/nephila/config.toml ;
#   3. ~/.config/nephila/config.toml.
#
# Ce fichier est facultatif. Sans lui, ou avec `nephila build --no-llm`, nephila construit la
# structure du graphe sans LLM (bilan : `enrichissement : désactivé`). Le LLM est actif quand ce
# fichier existe et que `--no-llm` est absent ; il sert à enrichir (résumés, concepts) et à
# `query ask`.
#
# Règles :
#   - un fichier invalide est une erreur avant tout traitement (sauf avec `--no-llm`) ;
#   - une clé inconnue est refusée ;
#   - TOML n'admet qu'une valeur par clé : gardez une seule section fournisseur active, les
#     autres restent en commentaire ;
#   - la clé d'API n'est jamais écrite ici : `api_key_env` donne le NOM de la variable
#     d'environnement qui la contient. Elle n'est pas vérifiée à l'avance : une clé refusée est
#     constatée au premier appel au LLM et arrête l'enrichissement ; la structure du graphe est
#     déjà construite, et nephila update reprend les fichiers à enrichir.
#
# Un dépôt peut remplacer six réglages par son fichier .nephila.toml (model, max_chunk_chars, concurrency, timeout_secs, batch_files, format_retries) ; les autres clés ne sont lues qu'ici.
#
# Enrichissements conservés : un fichier déjà enrichi n'est renvoyé au LLM que si son contenu
# change ou si le modèle change (ici ou dans .nephila.toml) ; les autres réglages ne
# réenrichissent rien.
#
# Les clés communes à tous les fournisseurs (taille des morceaux, parallélisme, délais, TLS)
# sont en fin de fichier, dans « Options communes ».

# --- Anthropic ---
# Fournisseur actif dans cet exemple. Puis : export ANTHROPIC_API_KEY=...

# Fournisseur du LLM. Texte : « anthropic », « openai » (protocole compatible OpenAI) ou
# « mock ». Obligatoire.
provider = "anthropic"

# Nom du modèle, texte non vide. Obligatoire, sauf pour le fournisseur « mock » (valeur par
# défaut : « mock »). Un dépôt peut le remplacer par son .nephila.toml.
# Priorité : .nephila.toml du dépôt > ce fichier > défaut.
model = "claude-sonnet-4-5"

# NOM de la variable d'environnement qui contient la clé d'API (jamais la clé elle-même).
# Obligatoire pour « anthropic » ; facultatif pour « openai » (aucun défaut : sans cette clé,
# aucune clé n'est envoyée, ce qui convient à un modèle local).
api_key_env = "ANTHROPIC_API_KEY"

# URL du serveur, texte non vide, SANS « /v1 » final : nephila ajoute lui-même /v1/... aux
# requêtes. Défaut : https://api.anthropic.com pour « anthropic », https://api.openai.com pour
# « openai ». Utile pour passer par un proxy ou une passerelle.
# base_url = "https://api.anthropic.com"

# --- OpenAI ---
# Puis : export OPENAI_API_KEY=...
# Pour utiliser cette section, mettez la section Anthropic en commentaire et réactivez ces
# lignes (provider, model et api_key_env sont décrites dans la section Anthropic).
# provider = "openai"
# model = "gpt-4o-mini"
# api_key_env = "OPENAI_API_KEY"

# --- Modèle local (Ollama) ---
# Pas de clé d'API. `base_url` SANS « /v1 » final : avec http://localhost:11434/v1, les requêtes
# partiraient vers /v1/v1/chat/completions.
# provider = "openai"
# model = "llama3.1"
# base_url = "http://localhost:11434"

# --- Autre serveur compatible OpenAI (llama.cpp, vLLM, LM Studio) ---
# Serveur local ou distant qui parle le protocole OpenAI. Adaptez le nom du modèle et le port
# (ports usuels : 8080 pour llama.cpp, 8000 pour vLLM, 1234 pour LM Studio). Si le serveur exige
# une clé, ajoutez `api_key_env` comme dans la section OpenAI. `base_url` reste SANS « /v1 »
# final.
# provider = "openai"
# model = "nom-du-modele-servi"
# base_url = "http://localhost:8080"

# --- LLM simulé ---
# Remplace le LLM par des fixtures, sans réseau : pour les tests et les démonstrations. `model`
# est facultatif ; `timeout_secs`, `tls_ca_cert` et `tls_insecure` sont sans effet. Le détail de
# chaque variable est dans la section « LLM simulé » du README.
# provider = "mock"
#
# Variables d'environnement lues par ce fournisseur :
#   NEPHILA_MOCK_DIR               dossier de fixtures (réponses d'enrichissement et de `query ask`)
#   NEPHILA_MOCK_LOG               fichier de journal des appels, une ligne par appel
#   NEPHILA_MOCK_FAIL_AFTER        nombre d'appels réussis avant des erreurs réseau simulées
#   NEPHILA_MOCK_INVALID_KEY       si non vide et différent de 0, chaque appel échoue en « clé refusée »
#   NEPHILA_MOCK_DELAY_MS          délai ajouté à chaque appel, en millisecondes
#   NEPHILA_MOCK_TIMEOUT_FILES     chemins relatifs, séparés par des virgules, dont l'appel
#                                  échoue par délai dépassé
#   NEPHILA_MOCK_KEY_REVOKED_AFTER nombre d'appels d'enrichissement avant des refus de clé
#                                  simulés
#   NEPHILA_MOCK_MALFORMED         <chemin>:<k>[,<chemin>:<k>...] : les k premiers appels qui
#                                  portent ce fichier reçoivent une réponse non conforme

# --- Options communes ---
# Valables pour tous les fournisseurs. Les lignes ci-dessous montrent les valeurs par défaut
# (sauf tls_ca_cert, qui n'a pas de défaut) : décommentez une ligne pour la changer.

# Enrichit aussi les fichiers de code. Booléen. Défaut : false : seuls les documents Markdown
# sont enrichis (résumés et concepts) ; le code source, les fichiers de build et les fichiers
# de données gardent leur structure, sans résumé, et ne comptent pas dans « fichiers à
# enrichir ». true : ils reçoivent aussi des résumés (comportement de la 0.17). Les résumés
# déjà faits sont conservés tant que le fichier ne change pas, même en repassant à false.
# Remplacé, pour une commande, par l'option --enrich-code (qui vaut true). Lue ici seulement :
# .nephila.toml la refuse.
# Priorité : --enrich-code > ce fichier > défaut.
# enrich_code = false

# Taille maximale, en caractères, d'un morceau de fichier envoyé au LLM. Entier > 0.
# Défaut : 60000. Un lot de fichiers (voir batch_files) ne dépasse jamais cette taille.
# Un dépôt peut le remplacer par son .nephila.toml.
# Priorité : .nephila.toml du dépôt > ce fichier > défaut.
# max_chunk_chars = 60000

# Nombre d'appels LLM simultanés. Entier > 0. Défaut : 4. Borne aussi le nombre de fils de
# l'analyse syntaxique.
# Un dépôt peut le remplacer par son .nephila.toml.
# Priorité : .nephila.toml du dépôt > ce fichier > défaut.
# concurrency = 4

# Durée maximale d'un appel LLM HTTP entier, en secondes. Entier > 0. Défaut : 300. La
# connexion est limitée à 10 s, quelle que soit cette valeur. Sans effet avec « mock ».
# Un dépôt peut le remplacer par son .nephila.toml.
# Priorité : .nephila.toml du dépôt > ce fichier > défaut.
# timeout_secs = 300

# Nombre maximal de fichiers par appel d'enrichissement. Entier > 0. Défaut : 10 ; 1 = un fichier
# par appel. Un lot ne dépasse jamais
# max_chunk_chars et un gros fichier part seul ; concurrency x batch_files fichiers sont en vol
# au plus. Remplacé, pour une commande, par l'option --batch-files ; un dépôt peut le remplacer
# par son .nephila.toml.
# Priorité : --batch-files > .nephila.toml du dépôt > ce fichier > défaut.
# batch_files = 10

# Nouveaux essais d'un appel dont la réponse est non conforme. Entier >= 0. Défaut : 2, soit au
# plus 3 appels pour une même requête ; 0 = aucun nouvel essai. Ces essais ne portent que sur le
# format de la réponse ; les erreurs réseau et les réponses 429 et 5xx ont leurs propres nouveaux
# essais (4 au plus, attente progressive), les délais dépassés et les clés refusées ne sont
# jamais retentés. Remplacé, pour une commande, par
# l'option --format-retries ; un dépôt peut le remplacer par son .nephila.toml.
# Priorité : --format-retries > .nephila.toml du dépôt > ce fichier > défaut.
# format_retries = 2

# Fichier PEM d'autorités de certification, AJOUTÉES aux autorités publiques embarquées dans
# nephila (le magasin du système n'est pas lu ; pour s'y fier, donnez
# /etc/ssl/certs/ca-certificates.crt). Texte non vide : chemin absolu, « ~/... », ou relatif au
# dossier de ce fichier de configuration. Défaut : aucun. Utile derrière un proxy d'entreprise ou
# face à un serveur à certificat privé. Sans effet avec « mock » et avec une base_url en http://.
# tls_ca_cert = "certs/ca.pem"

# Désactive tout contrôle du certificat du serveur (chaîne, dates, nom d'hôte), comme `curl -k` ;
# la connexion reste chiffrée. Booléen. Défaut : false. Un avertissement est écrit à chaque
# commande. L'emporte sur tls_ca_cert. À réserver à un poste de développement. Sans effet avec
# « mock » et avec une base_url en http://.
# tls_insecure = false
