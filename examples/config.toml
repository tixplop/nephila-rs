# Exemple de configuration de nephila.
# Emplacement : $NEPHILA_CONFIG, sinon $XDG_CONFIG_HOME/nephila/config.toml,
# sinon ~/.config/nephila/config.toml.
# Gardez une seule section `provider` active.
#
# Ce fichier est facultatif : sans lui (ou avec `nephila build --no-llm`), nephila construit la
# structure du graphe sans LLM. Le LLM sert à enrichir (résumés, concepts) et à `query ask`.

# --- Anthropic ---
provider = "anthropic"
model = "claude-sonnet-4-5"
api_key_env = "ANTHROPIC_API_KEY"   # nom de la variable, jamais la clé elle-même
# base_url = "https://api.anthropic.com"

# --- Serveur compatible OpenAI (OpenAI, Ollama, llama.cpp, vLLM...) ---
# provider = "openai"
# model = "gpt-4o-mini"
# api_key_env = "OPENAI_API_KEY"
#
# Modèle local avec Ollama : pas de clé, et base_url SANS « /v1 » final
# (nephila ajoute lui-même /v1/chat/completions et /v1/models) :
# provider = "openai"
# model = "llama3.1"
# base_url = "http://localhost:11434"

# --- LLM simulé, pour les tests (voir NEPHILA_MOCK_* dans le README) ---
# provider = "mock"

# Options communes (valeurs par défaut)
# max_chunk_chars = 60000   # taille maximale d'un morceau envoyé au LLM
# concurrency = 4           # appels LLM simultanés
# timeout_secs = 300        # durée maximale d'un appel LLM HTTP, en secondes (entier > 0)
# batch_files = 8           # fichiers par appel d'enrichissement (défaut 1 ; 4 à 8 pour de nombreux petits fichiers)
# format_retries = 2        # nouveaux essais d'un appel dont la réponse est non conforme (entier ≥ 0 ; 0 = aucun)
