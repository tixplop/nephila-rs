# Exemple de fichier de projet de nephila (copié sous le nom nephila.example.toml dans l'archive
# de release). Ce n'est PAS la configuration du LLM (voir config.toml) : sa présence n'active pas
# le LLM.
#
# Emplacement : `.nephila.toml` à la racine du dépôt analysé (le dossier désigné par `-C`) ; un
# fichier placé dans un sous-dossier n'est pas lu. Fichier facultatif, à versionner avec le
# dépôt : nephila ne le crée ni ne le réécrit jamais.
#
# Lu par `build`, `update`, `status` et par l'avertissement « graphe pas à jour » des `query`,
# avec ou sans `--no-llm`. Ni `export` ni `summary` ne le lisent.
#
# Il sert à exclure des fichiers de l'analyse et à régler le LLM pour ce dépôt. Toutes les clés
# sont facultatives ; toute autre clé est une erreur, signalée avant tout parcours. Dans cet
# exemple, toutes les clés sont en commentaire : copié tel quel dans un dépôt, ce fichier ne
# filtre rien et ne règle rien. Décommentez ce qui vous sert.
# Copié tel quel, ce fichier n'a aucun effet : toutes les clés sont désactivées.
#
# Un filtre s'ajoute à ce que nephila ignore déjà (.gitignore, target/, build/, .gradle/, .git/,
# .nephila/, node_modules/) et à ce qu'il exclut par défaut (voir exclude_defaults) ; il ne peut
# jamais réinclure un fichier ignoré ou exclu par défaut.
#
# Les options `--exclude` et `--exclude-type` de `build` et `update` s'ajoutent à ces clés, pour
# la commande seulement : les types sont réunis, les motifs forment une seule liste (ceux de ce
# fichier, puis ceux de l'option) où le dernier motif qui s'applique l'emporte.
#
# Effet incrémental : un fichier déjà indexé qui devient exclu est retiré du graphe par
# `nephila update` ; un fichier qui cesse d'être exclu y est ajouté. `update` suffit, pas besoin
# de `build`. Le bilan de `build` et de `update` compte les « fichiers exclus par les filtres ».

# --- Filtres ---

# Motifs de fichiers à exclure. Tableau de textes. Défaut : aucun. Syntaxe de .gitignore, relative
# à la racine du dépôt, sensible à la casse :
#   - un motif sans « / » (`*.min.js`) vaut à tous les niveaux ;
#   - un « / » au début ou au milieu (`/src/gen/`, `web/dist`) ancre le motif à la racine ;
#   - un « / » final (`docs/legacy/`) ne désigne que des dossiers ;
#   - `**` traverse les dossiers (`**/generated/**`) ;
#   - `!motif` réinclut ce qu'un motif précédent a exclu (le dernier motif qui s'applique
#     l'emporte).
# Complété, pour une commande, par l'option --exclude <MOTIF> (répétable).
# exclude = ["docs/legacy/", "*.min.js"]

# Types de fichiers à exclure. Tableau de noms en minuscules, comparés tels quels. Défaut :
# aucun. Chaque fichier pris en charge a un seul type :
#   markdown    .md, .markdown
#   java        .java
#   kotlin      .kt, .kts (sauf build.gradle.kts et settings.gradle.kts)
#   groovy      .groovy
#   scala       .scala
#   javascript  .js, .mjs, .cjs, .jsx
#   typescript  .ts, .mts, .cts, .tsx (.d.ts compris)
#   sql         .sql
#   xml         .xml (sauf pom.xml et ivy.xml)
#   json        .json (sauf package.json)
#   yaml        .yaml, .yml
#   maven       pom.xml
#   ivy         ivy.xml
#   gradle      .gradle, build.gradle.kts, settings.gradle.kts
#   npm         package.json
# Pas de groupes : pour exclure les fichiers de données, écrivez
# ["sql", "xml", "json", "yaml"]. Complété, pour une commande, par l'option
# --exclude-type <TYPE>[,<TYPE>...].
# exclude_types = ["json"]

# Exclusions par défaut : les dossiers dist/, out/, coverage/, .next/, .nuxt/, vendor/ et .idea/,
# à tout niveau du dépôt, et les fichiers *.min.js ne sont pas analysés. Booléen ; défaut : true.
# false : ces chemins sont analysés comme les autres fichiers (types pris en charge, .gitignore,
# exclude et exclude_types) ; utile quand l'un de ces dossiers contient votre code. Pour en
# garder certains exclus, ajoutez-les à exclude. Ce ne sont pas des filtres : ils ne comptent
# pas dans « fichiers exclus par les filtres », et !motif ne les réinclut pas. Pas d'option de
# ligne de commande : la clé vaut pour toutes les commandes, status compris.
# exclude_defaults = false

# --- Réglages LLM du dépôt ---
# Ils remplacent, clé par clé, la configuration personnelle (NEPHILA_CONFIG, sinon ~/.config/nephila/config.toml).
# Elle seule active le LLM : sans elle, ou avec --no-llm, ces réglages n'ont aucun effet et rien n'est affiché.
# Changer model fait réenrichir les fichiers déjà enrichis, par nephila update comme par nephila build ; les autres réglages ne réenrichissent rien.
# Valeurs effectives et réglages venus de ce fichier : nephila build --verbose (ligne config).
# Refusées ici (configuration personnelle seulement) : provider, base_url, api_key_env, tls_ca_cert, tls_insecure.
# Raison : ce fichier est versionné ; un dépôt cloné ne doit pas pouvoir envoyer votre code ou votre clé d'API à un autre serveur, ni couper le contrôle des certificats.
# Plafonds : ici seulement, chaque réglage entier a un plafond (ligne « Plafond dans ce fichier ») ; la configuration personnelle et les options n'en ont pas.

# Nom du modèle utilisé pour ce dépôt. Texte non vide. Remplace le modèle de la configuration
# personnelle.
# Priorité : ce fichier > configuration personnelle > défaut.
# model = "claude-sonnet-4-5"

# Taille maximale, en caractères, d'un morceau de fichier envoyé au LLM. Entier > 0. Remplace la
# valeur de la configuration personnelle.
# Plafond dans ce fichier : au plus 1000000.
# Priorité : ce fichier > configuration personnelle > défaut.
# max_chunk_chars = 30000

# Nombre d'appels LLM simultanés. Entier > 0. Remplace la valeur de la configuration personnelle.
# Sans effet sur l'extraction : ses fils se règlent par l'option --jobs, qui n'a pas de clé.
# Plafond dans ce fichier : au plus 64.
# Priorité : ce fichier > configuration personnelle > défaut.
# concurrency = 2

# Durée maximale d'un appel LLM HTTP entier, en secondes. Entier > 0. Remplace la valeur de la
# configuration personnelle.
# Plafond dans ce fichier : au plus 3600.
# Priorité : ce fichier > configuration personnelle > défaut.
# timeout_secs = 600

# Nombre maximal de fichiers par appel d'enrichissement. Entier > 0. Remplace la valeur de la
# configuration personnelle ; l'option --batch-files l'emporte, pour une commande.
# Plafond dans ce fichier : au plus 100.
# Priorité : --batch-files > ce fichier > configuration personnelle > défaut.
# batch_files = 4

# Nouveaux essais d'un appel dont la réponse est non conforme. Entier >= 0. Remplace la valeur de
# la configuration personnelle ; l'option --format-retries l'emporte, pour une commande.
# Plafond dans ce fichier : au plus 10.
# Priorité : --format-retries > ce fichier > configuration personnelle > défaut.
# format_retries = 4

# --- Réglages de query ask ---
# Section [ask] : elle ne vaut que pour nephila query ask. L'enrichissement n'en lit rien, et la
# changer ne réenrichit rien. Chaque clé l'emporte, pour query ask, sur la même clé de la
# configuration personnelle (section [ask] comprise) et, pour model, sur model ci-dessus.
# Un dépôt cloné peut ainsi choisir le modèle de query ask et y demander la réflexion : lisez
# cette section avant d'interroger un dépôt tiers. Valeurs effectives et clés venues de ce
# fichier : nephila query ask --verbose (ligne config). Clés de connexion refusées ici aussi.
# Placez cette section à la fin du fichier : toute clé écrite après la ligne [ask] en fait partie.
# [ask]

# Modèle qui répond aux questions. Texte non vide. Absente : le modèle de l'enrichissement.
# Priorité : ce fichier > [ask] de la configuration personnelle > model ci-dessus > model personnel.
# model = "claude-opus-5-5"

# Réflexion demandée pour query ask. Booléen, true ou false ; absente : celle de la
# configuration personnelle, sinon false. Permise ici dans [ask] seulement.
# Priorité : ce fichier > configuration personnelle ([ask], puis premier niveau) > défaut.
# thinking = true

# Niveau d'effort pour query ask : "low", "medium", "high" ou "default" ; absente : celui de la
# configuration personnelle, sinon "low". Permise ici dans [ask] seulement.
# Priorité : ce fichier > configuration personnelle ([ask], puis premier niveau) > défaut.
# effort = "medium"

# Nombre maximal de jetons de la réponse de query ask, réflexion comprise. Entier > 0 ;
# absente : celui de la configuration personnelle, sinon 16384.
# Plafond dans ce fichier : au plus 16384.
# Priorité : ce fichier > configuration personnelle ([ask], puis premier niveau) > défaut.
# max_output_tokens = 4096

# Nombre maximal de caractères du contexte envoyé au LLM, en-têtes compris. Entier, au moins
# 1000 ; absente : 12000. Le nombre de nœuds reste borné par max_nodes.
# Plafond dans ce fichier : au plus 100000.
# Priorité : --context-chars > ce fichier > configuration personnelle > défaut.
# max_context_chars = 30000

# Nombre maximal de nœuds de départ, ceux que trouvent les mots de la question. Entier > 0 ;
# absente : 20 ; jamais plus que max_nodes.
# Plafond dans ce fichier : au plus 100.
# Priorité : ce fichier > configuration personnelle > défaut.
# max_seeds = 30

# Nombre maximal de nœuds du contexte, nœuds de départ compris. Entier > 0 ; absente : 60.
# Plafond dans ce fichier : au plus 500.
# Priorité : ce fichier > configuration personnelle > défaut.
# max_nodes = 120
