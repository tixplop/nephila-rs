[package]
name = "repo-knowledge-graph"
version = "0.1.0"
edition = "2021"

[lib]
name = "rkg"
path = "src/lib.rs"

[[bin]]
name = "rkg"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
