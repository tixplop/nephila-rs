[package]
name = "nephila-rs"
version = "0.8.0"
edition = "2021"

[lib]
name = "nephila"
path = "src/lib.rs"

[[bin]]
name = "nephila"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
blake3 = "1"
ignore = "0.4"
libc = "0.2"
ureq = "2"
tree-sitter = "0.27"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-scala = "0.26"
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = "0.42"
tree-sitter-groovy = "0.1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
